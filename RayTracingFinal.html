<script id="vshader" type="x-shader/x-vertex">
   attribute vec3 aPosition;
   varying   vec3 vPosition;
   void main() {
      gl_Position = vec4(aPosition, 1.0);
      vPosition = aPosition;
   }
</script>

<script id="fshader" type="x-shader/x-fragment">
    precision mediump float;
    varying vec3 vPosition;
    uniform int sceneFlag;

    //Structs
    struct Sphere {
        vec3 center;
        float radius;
        vec3 color;
        int reflective;
        int trueReflective;
        int tag;
    };

    struct Plane {
        vec3 point1;
        vec3 point2;
        vec3 point3;
        vec3 color;
        int reflective;
        
    };

    struct Ray {
        vec3 origin;
        vec3 direction;
    };

    struct Light {
        vec3 position;
        float ambience;
        vec3 specular;
        vec3 diffuse;
    };

    struct RayTracerOutput {
        Ray reflectedRay;
        vec3 color;
    };

    //Global Variables
    Sphere spheres[4];
    Plane planes[12];
    int sphereCount = 4;
    int planeCount = 1;
    int numOfReflections = 1;
    Ray rays[1];
    Light light[1];

    Plane floor;

    //Sets up the box for scene 3
    void setupBox(){
        //Floor
        planes[0].point1 = vec3(-1.0, -0.5, -1.0);
        planes[0].point3 = vec3(1.0, -0.5, -1.0);
        planes[0].point2 = vec3(-1.0, -0.5, 1.0);
        planes[0].color = vec3(0.0, 0.0, 1.0);
        planes[0].reflective = 2;

        planes[1].point1 = vec3(1.0, -0.5, 1.0);
        planes[1].point2 = vec3(1.0, -0.5, -1.0);
        planes[1].point3 = vec3(-1.0, -0.5, 1.0);
        planes[1].color = vec3(0.0, 0.0, 1.0);
        planes[1].reflective = 2;

        //Roof
        planes[2].point1 = vec3(-1.0, 1.5, 1.0);
        planes[2].point3 = vec3(1.0, 1.5, 1.0);
        planes[2].point2 = vec3(-1.0, 1.5, -1.0);
        planes[2].color = vec3(1.0, 0.0, 1.0);
        planes[2].reflective = 2;

        planes[3].point1 = vec3(1.0, 1.5, -1.0);
        planes[3].point2 = vec3(1.0, 1.5, 1.0);
        planes[3].point3 = vec3(-1.0, 1.5, -1.0);
        planes[3].color = vec3(1.0, 0.0, 1.0);
        planes[3].reflective = 2;

        //Front
        planes[4].point1 = vec3(-1.0, 1.5, -1.0);
        planes[4].point3 = vec3(1.0, 1.5, -1.0);
        planes[4].point2 = vec3(-1.0, -0.5, -1.0);
        planes[4].color = vec3(1.0, 1.0, 0.0);
        planes[4].reflective = 2;

        planes[5].point1 = vec3(1.0, -0.5, -1.0);
        planes[5].point2 = vec3(1.0, 1.5, -1.0);
        planes[5].point3 = vec3(-1.0, -0.5, -1.0);
        planes[5].color = vec3(1.0, 1.0, 0.0);
        planes[5].reflective = 2;

        //Back
        planes[6].point1 = vec3(1.0, 1.5, 1.0);
        planes[6].point3 = vec3(-1.0, 1.5, 1.0);
        planes[6].point2 = vec3(1.0, -0.5, 1.0);
        planes[6].color = vec3(1.0, 1.0, 1.0);
        planes[6].reflective = 2;

        planes[7].point1 = vec3(-1.0, -0.5, 1.0);
        planes[7].point2 = vec3(-1.0, 1.5, 1.0);
        planes[7].point3 = vec3(1.0, -0.5, 1.0);
        planes[7].color = vec3(1.0, 1.0, 1.0);
        planes[7].reflective = 2;

        //Left
        planes[8].point1 = vec3(-1.0, 1.5, 1.0);
        planes[8].point3 = vec3(-1.0, 1.5, -1.0);
        planes[8].point2 = vec3(-1.0, -0.5, 1.0);
        planes[8].color = vec3(0.0, 1.0, 1.0);
        planes[8].reflective = 2;

        planes[9].point1 = vec3(-1.0, -0.5, -1.0);
        planes[9].point2 = vec3(-1.0, 1.5, -1.0);
        planes[9].point3 = vec3(-1.0, -0.5, 1.0);
        planes[9].color = vec3(0.0, 1.0, 1.0);
        planes[9].reflective = 2;

        //Right
        
        planes[10].point1 = vec3(1.0, 1.5, -1.0);
        planes[10].point3 = vec3(1.0, 1.5, 1.0);
        planes[10].point2 = vec3(1.0, -0.5, -1.0);
        planes[10].color = vec3(0.0, 1.0, 0.0);
        planes[10].reflective = 2;

        planes[11].point1 = vec3(1.0, -0.5, 1.0);
        planes[11].point2 = vec3(1.0, 1.5, 1.0);
        planes[11].point3 = vec3(1.0, -0.5, -1.0);
        planes[11].color = vec3(0.0, 1.0, 0.0);
        planes[11].reflective = 2;
        

     }

    void initialize() {
        float x = vPosition.x;
        float y = vPosition.y;
        float z = vPosition.z;
        float focalLength = 1.0;
        vec3 color = vec3(0.0, 0.0, 0.0);

        //Scene Setup
        if(sceneFlag == 1){     //Scene 1
            focalLength = 2.0;
            numOfReflections = 1;
            // Create spheres Red
            spheres[0].center = vec3(-0.3, 0.3, 0.0);
            spheres[0].radius = 0.3;
            spheres[0].color = vec3(1.0, 0.0, 0.0);
            spheres[0].reflective = 1;
            spheres[0].trueReflective = 0;
            spheres[0].tag = 0;

            // Create spheres Green
            spheres[1].center = vec3(0.3, 0.3, -0.1);
            spheres[1].radius = 0.3;
            spheres[1].color = vec3(0.0, 1.0, 0.0);
            spheres[1].reflective = 2;
            spheres[1].trueReflective = 0;
            spheres[1].tag = 1;

            sphereCount = 2;

            planes[0].point1 = vec3(-2.0, 0.0, -2.0);
            planes[0].point3 = vec3(2.0, 0.0, -2.0);
            planes[0].point2 = vec3(-2.0, 0.0, 2.0);
            planes[0].color = vec3(0.0, 0.0, 1.0);
            planes[0].reflective = 1;

            planes[1].point1 = vec3(2.0, 0.0, 2.0);
            planes[1].point2 = vec3(2.0, 0.0, -2.0);
            planes[1].point3 = vec3(-2.0, 0.0, 2.0);
            planes[1].color = vec3(0.0, 0.0, 1.0);
            planes[1].reflective = 1;


            // Create ray
            rays[0].origin = vec3(0.0, 0.5, focalLength);
            rays[0].direction = normalize(vec3(x, y, -focalLength));

            light[0].position = vec3(-1.0, 1.0, 1.2);
            light[0].ambience = 0.2;
            light[0].specular = vec3(1.0,1.0,1.0);
        }
        else if(sceneFlag == 2){    //Scene 2
            focalLength = 2.0;
            //Specify number of reflections
            numOfReflections = 2;
            // Create spheres Red
            spheres[0].center = vec3(-0.4, -0.4, 0.0);
            spheres[0].radius = 0.3;
            spheres[0].color = vec3(1.0, 0.0, 0.0);
            spheres[0].reflective = 1;
            spheres[0].trueReflective = 0;
            spheres[0].tag = 0;
        
            // Create spheres Green
            spheres[1].center = vec3(0.4, 0.4, 0.0);
            spheres[1].radius = 0.3;
            spheres[1].color = vec3(0.0, 1.0, 0.0);
            spheres[1].reflective = 1;
            spheres[1].trueReflective = 0;
            spheres[1].tag = 1;

            // Create spheres Blue
            spheres[2].center = vec3(0.4, -0.4, 0.0);
            spheres[2].radius = 0.3;
            spheres[2].color = vec3(0.0, 0.0, 1.0);
            spheres[2].reflective = 1;
            spheres[2].trueReflective = 0;
            spheres[2].tag = 2;

            // Create spheres Yellow
            spheres[3].center = vec3(-0.4, 0.4, 0.0);
            spheres[3].radius = 0.3;
            spheres[3].color = vec3(1.0, 1.0, 0.0);
            spheres[3].reflective = 1;
            spheres[3].trueReflective = 0;
            spheres[3].tag = 3;

            sphereCount = 4;

            // Create ray
            rays[0].origin = vec3(0.0, 0.0, focalLength);
            rays[0].direction = normalize(vec3(x, y, -focalLength));

            light[0].position = vec3(0.0, 0.0, 0.9);
            light[0].ambience = 0.4;
            light[0].specular = vec3(1.0,1.0,1.0);

        }
        else if(sceneFlag == 3){    //Scene 3
            focalLength = 1.0;
            numOfReflections = 1;
            // Create spheres Red
            spheres[0].center = vec3(-0.5, -0.1, -0.4);
            spheres[0].radius = 0.3;
            spheres[0].color = vec3(1.0, 0.0, 0.0);
            spheres[0].reflective = 1;
            spheres[0].trueReflective = 1;
            spheres[0].tag = 0;
        
            // Create spheres Green
            spheres[1].center = vec3(0.5, -0.1, 0.0);
            spheres[1].radius = 0.3;
            spheres[1].color = vec3(0.0, 1.0, 0.0);
            spheres[1].reflective = 2;
            spheres[1].trueReflective = 0;
            spheres[1].tag = 1;

            sphereCount = 2;

            //Create Box
            setupBox();

            // Create ray
            rays[0].origin = vec3(0.0, 0.4, focalLength);
            rays[0].direction = normalize(vec3(x, y, -focalLength));

            light[0].position = vec3(0.0, 1.3, 0.5);
            light[0].ambience = 0.2;
            light[0].specular = vec3(1.0,1.0,1.0);
        }

        // Create Light source
        
    }

    //Return the normals of a triangle
    vec3 normalOfTriangle(Plane p){
        vec3 edge1 = p.point2 - p.point1;
        vec3 edge2 = p.point3 - p.point1;

        vec3 n = normalize(vec3(edge1.y * edge2.z - edge1.z * edge2.y,
                        edge1.z * edge2.x - edge1.x * edge2.z,
                        edge1.x * edge2.y - edge1.y * edge2.x));

        return n;
    }

    //Check for intersection on a plane
    float checkIntersectPlane(Plane p, Ray ray){

        float D = -(dot(normalOfTriangle(p), p.point1));

        if(dot(normalOfTriangle(p), ray.direction) == 0.0)    //Check if ray and plane are parallel to avoid dividing by 0
            return 0.0;

        float t = -(dot(normalOfTriangle(p),ray.origin) + D) / dot(normalOfTriangle(p),ray.direction);
        if(t < 0.0)       //Check that the plane isn't behind the ray.
            return 0.0;

        vec3 P = ray.origin + t * ray.direction;

        vec3 edge1 = p.point2 - p.point1;
        vec3 edge2 = p.point3 - p.point2;
        vec3 edge3 = p.point1 - p.point3;

        vec3 c0 = P - p.point1;
        vec3 c1 = P - p.point2;
        vec3 c2 = P - p.point3;

        //Check if p is inside the triangle. Return t if true, return 0.0 if false
        if(dot(normalOfTriangle(p), cross(edge1, c0)) > 0.0 &&
            dot(normalOfTriangle(p), cross(edge2, c1)) > 0.0 &&
             dot(normalOfTriangle(p), cross(edge3, c2)) > 0.0){
            return t;
        }
        else{
            return 0.0;
        }

        return 0.0;
    }

    //Check for intersection on a sphere
    float checkIntersectSphere(Sphere sphere, Ray ray) {
        vec3 sphereCenter = sphere.center;
        float radius = sphere.radius;
        vec3 cameraSource = ray.origin;
        vec3 cameraDirection = ray.direction;

        vec3 distanceFromCenter = (cameraSource - sphereCenter);
        float B = 2.0 * dot(cameraDirection, distanceFromCenter);
        float C = dot(distanceFromCenter, distanceFromCenter) - pow(radius, 2.0);
        float delta = pow(B, 2.0) - 4.0 * C;
        float t = 0.0;
        if (delta > 0.0) {
            float sqRoot = sqrt(delta);
            float t1 = (-B + sqRoot) / 2.0;
            float t2 = (-B - sqRoot) / 2.0;
            t = min(t1, t2);
        }
        if (delta == 0.0) {
            t = -B / 2.0;
        }

        return t;
    }

    //Check for Shadows on spheres
    int checkShadowSphere(Ray ray, Sphere theSphere){
        //Ray is the ray being cast from the surface point to the light source. If there's a collision, return 1. Else return 0.
        float t = 0.0;
        float minT = 1000000.0;
        for(int i = 0; i < 4; i++) {
            if(theSphere != spheres[i]){
                t = checkIntersectSphere(spheres[i], ray);
                if(t > 0.0 && t < minT) {
                    minT = t;
                }
            }
        }

        if(minT > 0.0 && minT < 1000000.0){
            return 1;
        }
        else{
            return 0;
        }
    }
    //Check for shadows on planes
    int checkShadow(Ray ray){
        //Ray is the ray being cast from the surface point to the light source. If there's a collision, return 1. Else return 0.
        float t = 0.0;
        float minT = 1000000.0;
        for(int i = 0; i < 4; i++) {
            t = checkIntersectSphere(spheres[i], ray);
            if(t > 0.0 && t < minT) {
                minT = t;
            }
        }

        if(minT > 0.0 && minT < 1000000.0){
            return 1;
        }
        else{
            return 0;
        }
    }

    //Main Raytracing Function
     RayTracerOutput getRay(Ray ray, Light light) {

        RayTracerOutput rayTracer;
        vec3 color = vec3(0.0, 0.0, 0.0);

        float t = 0.0;
        float minT = 1000000.0;
        int spherePlaneFlag = 0;
        Sphere sphereToShow;
        Plane planeToShow;
        //Check for spheres
        for(int i = 0; i < 4; i++) {
                t = checkIntersectSphere(spheres[i], ray);
                if(t > 0.0 && t < minT) {
                    minT = t;
                    sphereToShow = spheres[i];
                    spherePlaneFlag = 1;
                }
            
        }
        //Check for planes
        for(int j = 0; j < 12; j++){
            t = checkIntersectPlane(planes[j],ray);
            if(t > 0.0 && t < minT){
                minT = t;
                planeToShow = planes[j];
                spherePlaneFlag = 2;
            }
        }

        if(minT > 0.0 && minT < 1000000.0) {

            //Draw the sphere
            if(spherePlaneFlag == 1){
                vec3 sphereCenter = sphereToShow.center;
                vec3 colorOfSphere = sphereToShow.color;
                vec3 cameraSource = ray.origin;
                vec3 cameraDirection = ray.direction;
                vec3 lightSource = light.position;
                float ambience = light.ambience;

                vec3 surfacePoint = cameraSource + (minT * cameraDirection);
                vec3 surfaceNormal = normalize(surfacePoint - sphereCenter);

                vec3 R = (2.0 * dot(normalize(lightSource - surfacePoint), surfaceNormal) * surfaceNormal) - normalize(lightSource - surfacePoint);
                vec3 V = normalize(-(surfacePoint - cameraSource));

                vec3 diffLight = vec3(1.0,1.0,1.0) * vec3(0.5,0.5,0.5);
                vec3 specular = (vec3(1.0,1.0,1.0) * vec3(0.5,0.5,0.5)) * pow(max(dot(V,R), 0.0), 10.0);
                vec3 diffuse = (diffLight * colorOfSphere) * dot(normalize(lightSource-surfacePoint),surfaceNormal);
                vec3 ambient = (vec3(ambience,ambience, ambience) * vec3( 0.3, 0.3, 0.3));

                //Check if sphere is fully reflective
                if(sphereToShow.trueReflective == 0){
                    //Check if sphere is reflective and will have a specular highlight
                    if(sphereToShow.reflective == 1)
                        color = colorOfSphere * (ambience  + ((1.0 - ambience) * max(0.0, dot(surfaceNormal, lightSource)))) + specular;
                    else
                        color = colorOfSphere * (ambience  + ((1.0 - ambience) * max(0.0, dot(surfaceNormal, lightSource))));
                }
                else{
                    color = specular;
                }

                Ray surfaceToLight;
                surfaceToLight.origin = surfacePoint;
                surfaceToLight.direction = normalize(light.position - surfacePoint);

                //Check for shadows from spheres
                int shadow = checkShadowSphere(surfaceToLight, sphereToShow);
                vec3 shadowColor;
                if(shadow == 0){
                    shadowColor = vec3(1,1,1);
                }
                else{
                    shadowColor = vec3(0.2,0.2,0.2);
                }

                rayTracer.color = color * shadowColor;

                //Create reflection ray for calculating reflection
                if(sphereToShow.reflective == 1){
                    Ray reflectionRay;
                    vec3 reflection = reflect(ray.direction, surfaceNormal);
                    reflectionRay.origin = surfacePoint - 0.0001 * surfaceNormal;
                    reflectionRay.direction = reflection;
                    rayTracer.reflectedRay = reflectionRay; 
                }
            }
            //Draw the plane
            else if(spherePlaneFlag == 2){
                vec3 colorOfPlane = planeToShow.color;
                vec3 cameraSource = ray.origin;
                vec3 cameraDirection = ray.direction;
                vec3 lightSource = light.position;
                float ambience = light.ambience;
                

                vec3 surfacePoint = cameraSource + (minT * cameraDirection);
                vec3 surfaceNormal = normalOfTriangle(planeToShow);
                if(planeToShow.reflective == 1)
                color = colorOfPlane * (ambience  + ((1.0 - ambience) * max(0.0, dot(surfaceNormal, lightSource))));
                else
                color = colorOfPlane;

                Ray surfaceToLight;
                surfaceToLight.origin = surfacePoint;
                surfaceToLight.direction = normalize(light.position - surfacePoint);

                //Check for shadows from spheres
                int shadow = checkShadow(surfaceToLight);
                vec3 shadowColor;
                if(shadow == 0){
                    shadowColor = vec3(1,1,1);
                }
                else{
                    shadowColor = vec3(0.35,0.35,0.35);
                }

                rayTracer.color = color * shadowColor;

                //Create reflection ray for calculating reflection
                if(planeToShow.reflective == 1 ){
                    Ray reflectionRay;
                    vec3 reflection = reflect(ray.direction, surfaceNormal);
                    reflectionRay.origin = surfacePoint;
                    reflectionRay.direction = reflection;
                    rayTracer.reflectedRay = reflectionRay; 
                }

            }
            


         }
         else {
            rayTracer.color = color;
         }

        return rayTracer;
     }

     

    void main() {
        initialize();
        RayTracerOutput mainRay = getRay(rays[0], light[0]);
        RayTracerOutput reflectionRay = getRay(mainRay.reflectedRay, light[0]);
        //Add another layer of reflections
        if(numOfReflections == 2){
            RayTracerOutput reflectionRay2 = getRay(reflectionRay.reflectedRay, light[0]);
            gl_FragColor = vec4(mainRay.color + reflectionRay.color + reflectionRay2.color, 1.0);
        }
        else
        gl_FragColor = vec4(mainRay.color + reflectionRay.color, 1.0);
   }
</script>
